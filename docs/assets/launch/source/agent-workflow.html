<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1600, initial-scale=1" />
    <link rel="stylesheet" href="./public-visuals.css" />
    <title>Clean Design agent workflow source</title>
  </head>
  <body>
    <main class="stage agent-workflow" data-export="agent-workflow">
      <div class="runtime-cluster">
        <div class="runtime-mark"><img src="../../../../apps/web/public/agent-icons/codex.svg" alt="" /></div>
        <div class="runtime-mark"><img src="../../../../apps/web/public/agent-icons/claude.svg" alt="" /></div>
        <div class="runtime-mark"><img src="../../../../apps/web/public/agent-icons/antigravity.svg" alt="" /></div>
        <div class="runtime-mark"><img src="../../../../apps/web/public/agent-icons/opencode.svg" alt="" /></div>
        <div class="runtime-mark"><img src="../../../../apps/web/public/agent-icons/pi.svg" alt="" /></div>
      </div>
      <div class="composer-object" aria-hidden="true">
        <span class="composer-plus">+</span>
        <span class="composer-line"></span>
        <span class="composer-send">→</span>
      </div>
      <div class="canvas-object" aria-hidden="true">
        <span class="canvas-sidebar"></span>
        <span class="canvas-artboard"></span>
        <span class="canvas-inspector"></span>
      </div>
      <div class="handoff-object" aria-hidden="true">
        <span class="handoff-folder"></span>
        <span class="handoff-sheet handoff-sheet-a"></span>
        <span class="handoff-sheet handoff-sheet-b"></span>
      </div>
      <svg class="workflow-line" viewBox="0 0 1600 900" aria-hidden="true">
        <path d="M 276 348 C 276 407 273 438 273 470 C 273 707 451 718 521 704 C 653 678 568 561 701 544 C 884 521 933 650 1052 653 C 1200 657 1246 606 1348 607" />
        <circle cx="276" cy="348" r="13" />
        <circle cx="521" cy="704" r="13" />
        <circle cx="1052" cy="653" r="13" />
        <circle cx="1348" cy="607" r="13" />
      </svg>
    </main>
  </body>
</html>
